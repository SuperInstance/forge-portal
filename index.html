<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚒️ The Forge — fleet image portal</title>
<style>
  :root {
    --bg: #0b0e13; --panel: #12161f; --edge: #232a38; --ink: #dfe6f2;
    --dim: #8b96ab; --hot: #f0a63c; --ok: #63d48e; --bad: #e06c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  header {
    padding: 18px 24px 6px; display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
  header span { color: var(--dim); font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 24px 60px; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 10px; padding: 16px; margin-top: 14px;
  }
  textarea, input, select {
    width: 100%; background: #0d1118; color: var(--ink);
    border: 1px solid var(--edge); border-radius: 6px; padding: 9px 11px;
    font: inherit; outline: none;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--hot); }
  textarea { min-height: 74px; resize: vertical; }
  label { display: block; color: var(--dim); font-size: 11px; margin: 10px 0 4px;
          text-transform: uppercase; letter-spacing: 1px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .backends { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill {
    cursor: pointer; border: 1px solid var(--edge); border-radius: 20px;
    padding: 6px 14px; color: var(--dim); font-size: 12px; user-select: none;
  }
  .pill.on { border-color: var(--hot); color: var(--hot); }
  button#go {
    width: 100%; margin-top: 14px; padding: 12px; font: inherit; font-weight: 700;
    letter-spacing: 2px; background: var(--hot); color: #14100a;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button#go:disabled { opacity: .5; cursor: wait; }
  .bar { height: 6px; background: #0d1118; border-radius: 4px; margin-top: 12px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--hot); transition: width .4s; }
  #status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 18px; }
  #result { margin-top: 14px; text-align: center; }
  #result img { max-width: 100%; border-radius: 10px; border: 1px solid var(--edge); }
  #result .meta { color: var(--dim); font-size: 11px; margin-top: 6px; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
             gap: 10px; margin-top: 12px; }
  #gallery figure { margin: 0; border: 1px solid var(--edge); border-radius: 8px;
                    overflow: hidden; background: #0d1118; }
  #gallery img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
  #gallery figcaption { padding: 6px 8px; font-size: 10px; color: var(--dim);
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 13px; color: var(--dim); letter-spacing: 2px; margin: 26px 0 0;
       text-transform: uppercase; }
  a { color: var(--hot); text-decoration: none; }
  .flash { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>⚒️ THE FORGE</h1>
  <span>one door, every image engine — local RV-Hyper · MMX · Workers AI · FLUX-2-max</span>
</header>
<main>
  <div class="panel">
    <label>Prompt</label>
    <textarea id="prompt" placeholder="what should the forge hammer out?"></textarea>
    <label>Negative prompt (local only)</label>
    <input id="negative" value="blurry, low quality, deformed, watermark">
    <label>Engine</label>
    <div class="backends" id="backends"></div>
    <div class="row">
      <div><label>Size</label>
        <select id="size">
          <option value="512x768">512×768 portrait</option>
          <option value="768x512">768×512 landscape</option>
          <option value="512x512">512×512 square</option>
          <option value="640x960">640×960 tall</option>
        </select></div>
      <div><label>Preset</label>
        <select id="preset">
          <option value="8,1.5">Hyper — 8 steps, CFG 1.5 (fast)</option>
          <option value="4,1.2">Hyper sprint — 4 steps, CFG 1.2</option>
          <option value="24,5">Quality — 24 steps, CFG 5.0</option>
        </select></div>
      <div><label>Seed (blank = random)</label><input id="seed" placeholder="random"></div>
    </div>
    <button id="go">IGNITE</button>
    <div class="bar"><div id="fill"></div></div>
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <h2>Gallery — latest landings</h2>
  <div id="gallery"></div>
</main>
<script>
const PRESETS = { local: true };
let backends = {}, chosen = "local", poll = null;

async function init() {
  backends = await (await fetch("/api/backends")).json();
  const box = document.getElementById("backends");
  for (const [k, label] of Object.entries(backends)) {
    const p = document.createElement("div");
    p.className = "pill" + (k === chosen ? " on" : "");
    p.textContent = label; p.dataset.k = k;
    p.onclick = () => { chosen = k;
      box.querySelectorAll(".pill").forEach(x => x.classList.toggle("on", x.dataset.k === k));
    };
    box.appendChild(p);
  }
  refreshGallery();
  setInterval(refreshGallery, 30000);
}

function refreshGallery() {
  fetch("/api/gallery").then(r => r.json()).then(items => {
    const g = document.getElementById("gallery");
    g.innerHTML = "";
    for (const it of items.slice(0, 40)) {
      const fig = document.createElement("figure");
      const img = document.createElement("img");
      img.src = "/gallery/" + it.file; img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = `[${it.backend}] ${it.prompt}`;
      fig.append(img, cap); g.appendChild(fig);
    }
  }).catch(() => {});
}

document.getElementById("go").onclick = async () => {
  const prompt = document.getElementById("prompt").value.trim();
  const status = document.getElementById("status");
  if (!prompt) { status.textContent = "give the forge a prompt."; return; }
  const [steps, cfg] = document.getElementById("preset").value.split(",");
  const [w, h] = document.getElementById("size").value.split("x");
  document.getElementById("go").disabled = true;
  document.getElementById("result").innerHTML = "";
  document.getElementById("fill").style.width = "4%";
  status.textContent = "queued…";
  const r = await fetch("/api/generate", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      prompt, negative: document.getElementById("negative").value,
      backend: chosen, seed: document.getElementById("seed").value || "random",
      steps: +steps, cfg: +cfg, width: +w, height: +h,
    }),
  });
  const { id, error } = await r.json();
  if (error) { status.textContent = error; document.getElementById("go").disabled = false; return; }
  clearInterval(poll);
  poll = setInterval(async () => {
    const j = await (await fetch("/api/job/" + id)).json();
    if (j.progress) document.getElementById("fill").style.width = j.progress + "%";
    status.textContent = j.state === "running"
      ? `${j.note} — step ${j.progress ?? 0}%` : j.state + "…";
    if (j.state === "done") {
      clearInterval(poll);
      document.getElementById("fill").style.width = "100%";
      status.textContent = `landed in ${j.secs}s · seed ${j.seed}`;
      document.getElementById("result").innerHTML =
        `<img src="/gallery/${j.file}"><div class="meta">${j.width}×${j.height} · ` +
        `${j.steps} steps · CFG ${j.cfg} · ${j.backend} · seed ${j.seed}</div>`;
      document.getElementById("go").disabled = false;
      refreshGallery();
    } else if (j.state === "error") {
      clearInterval(poll);
      status.innerHTML = `<span class="flash">FAILED: ${j.error}</span>`;
      document.getElementById("go").disabled = false;
    }
  }, 700);
};

init();
</script>
</body>
</html>
